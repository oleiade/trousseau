[advisories]
version = 2
ignore = [
    # RUSTSEC-2026-0009: stack exhaustion parsing the RFC 2822 date
    # format. trousseau only enables `time`'s `formatting`, `parsing`,
    # `serde-well-known` and `macros` features to read and write RFC
    # 3339 timestamps (`time::serde::rfc3339`); it never parses RFC 2822
    # input, so the affected code path is unreachable here. The fixed
    # release (>=0.3.46) requires rustc 1.88, above the workspace's
    # declared `rust-version = "1.85"` (section 2.4 of the implementation
    # plan); bumping the workspace MSRV is out of scope for step 2.1.
    # Revisit when the workspace MSRV moves, or `time` backports a fix
    # to an 1.85-compatible line.
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "LGPL-2.1-or-later",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
