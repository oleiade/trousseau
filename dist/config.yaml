version: 2
project_name: trousseau
release:
  github:
    owner: oleiade
    name: trousseau
  draft: true
  prerelease: auto
  name_template: '{{.Tag}}'
  extra_files:
    - glob: trousseau.cdx.json
  header: |
    # Trousseau {{ .Tag }} Release
  footer: |
    ## Installation

    * Binary downloads are available on the [releases page](https://github.com/oleiade/trousseau/releases).
    * Packages for various platforms are also available.
  mode: replace
builds:
  - id: trousseau
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    dir: .
    main: .
    binary: trousseau
    builder: rust
    tool: cargo
    command: zigbuild
    flags:
      - --release
      - -p=trousseau-cli
    env:
      - CARGO_NET_GIT_FETCH_WITH_CLI=true
archives:
  - id: trousseau-archives
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    files:
      - src: LICENSE
      - src: README.md
      - src: target/release-artifacts/completions/trousseau.bash
        dst: completions/trousseau.bash
      - src: target/release-artifacts/completions/trousseau.zsh
        dst: completions/trousseau.zsh
      - src: target/release-artifacts/completions/trousseau.fish
        dst: completions/trousseau.fish
      - src: target/release-artifacts/man/trousseau.1
        dst: man/trousseau.1
nfpms:
  - file_name_template: '{{ .PackageName }}_{{ .Version }}_{{ .Arch }}'
    package_name: trousseau
    contents:
      - src: LICENSE
        dst: /usr/share/doc/trousseau/LICENSE
      - src: README.md
        dst: /usr/share/doc/trousseau/README.md
      - src: target/release-artifacts/completions/trousseau.bash
        dst: /usr/share/bash-completion/completions/trousseau
      - src: target/release-artifacts/completions/trousseau.zsh
        dst: /usr/share/zsh/vendor-completions/_trousseau
      - src: target/release-artifacts/completions/trousseau.fish
        dst: /usr/share/fish/vendor_completions.d/trousseau.fish
      - src: target/release-artifacts/man/trousseau.1
        dst: /usr/share/man/man1/trousseau.1
    id: trousseau-packages
    formats:
      - apk
      - deb
    section: utils
    priority: optional
    vendor: Théo Crevon
    homepage: https://github.com/oleiade/trousseau
    maintainer: Théo Crevon <theo@crevon.me>
    description: Command-line interface for the trousseau encrypted keyring.
    license: MIT
    bindir: /usr/bin
    libdirs:
      header: /usr/include
      carchive: /usr/lib
      cshared: /usr/lib
srpm:
  package_name: trousseau
  file_name_template: '{{ .PackageName }}-{{ .Version }}.src.rpm'
  bins:
    trousseau: '%{goipath}'
snapshot:
  version_template: '{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}'
checksum:
  name_template: checksums.txt
  algorithm: sha256
docker_digest:
  name_template: digests.txt
changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  sort: asc
  format: '{{ .SHA }} {{ .Message }}'
dist: dist
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
before:
  hooks:
    - just generate-artifacts
    - just sbom
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    color: '#2D313E'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ print .ProjectName " " .Tag " is out! Check it out at " .ReleaseURL | mdv2escape }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m0s
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
brews:
  - name: trousseau
    repository:
      owner: oleiade
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: Brew formula update for {{ .ProjectName }} version {{ .Tag }}
    directory: Formula
    install: |
      bin.install "trousseau"
      bash_completion.install "completions/trousseau.bash" => "trousseau"
      zsh_completion.install "completions/trousseau.zsh" => "_trousseau"
      fish_completion.install "completions/trousseau.fish"
      man1.install "man/trousseau.1"
    test: |
      system "#{bin}/trousseau --version"
    description: Command-line interface for the trousseau encrypted keyring.
    homepage: https://github.com/oleiade/trousseau
    license: MIT
    goarm: "6"
    goamd64: v1
